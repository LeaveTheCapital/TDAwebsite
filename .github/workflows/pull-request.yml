name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record browser evidence
        run: npm run test:evidence

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
